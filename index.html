<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="나마 시바이">
  <meta name="theme-color" content="#1a1410">
  <title>나마 시바이</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/gyeonggi-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/gyeonggi-bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 표지 -->
  <section id="screen-cover" class="screen screen-cover active">
    <div class="cover-inner">
      <div class="cover-ornament-top">❖ &nbsp; ❖ &nbsp; ❖</div>
      <h1 class="cover-title">나마 시바이</h1>
      <div class="cover-mantra">॥ नमः शिवाय ॥</div>
      <p class="cover-subtitle">거룩한 다섯 음절의<br>풍성한 경전 모음</p>
      <button id="btn-enter" class="btn-enter">경전 목록 펴기</button>
      <div class="cover-ornament-bottom">❖ &nbsp; ❖ &nbsp; ❖</div>
    </div>
  </section>

  <!-- 경전 목록 -->
  <section id="screen-list" class="screen screen-list">
    <header class="list-header">
      <button id="btn-back-to-cover" class="btn-icon" aria-label="표지로">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 13h18v-2H3v2z M10 5l-7 7 7 7V5z"/></svg>
      </button>
      <h2 class="list-title">경전 모음</h2>
      <button id="btn-list-bookmarks" class="btn-icon" aria-label="책갈피 목록">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
    </header>

    <!-- 전체 검색 바 -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="모든 경전에서 검색..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="search-clear" class="search-clear" aria-label="지우기">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>

    <div class="list-content" id="list-content"></div>
  </section>

  <!-- 경전 읽기 -->
  <section id="screen-reader" class="screen screen-reader">
    <header class="reader-header">
      <button id="btn-back-to-list" class="btn-icon" aria-label="목록으로">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 13h18v-2H3v2z M10 5l-7 7 7 7V5z"/></svg>
      </button>
      <h2 class="reader-title" id="reader-title"></h2>
      <button id="btn-toc" class="btn-icon" aria-label="목차">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9h14V7H3v2zm0 4h14v-2H3v2zm0 4h14v-2H3v2zm16 0h2v-2h-2v2zm0-10v2h2V7h-2zm0 6h2v-2h-2v2z"/></svg>
      </button>
      <button id="btn-in-search" class="btn-icon" aria-label="본문 검색">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button id="btn-toggle-bookmark" class="btn-icon" aria-label="책갈피 추가/제거">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button id="btn-reader-settings" class="btn-icon" aria-label="읽기 설정">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
      </button>
    </header>

    <!-- 본문 안 검색 바 (한 자리에 한결같이) -->
    <div id="in-reader-search" class="in-reader-search">
      <div class="in-reader-search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="in-reader-search-input" class="in-reader-search-input" placeholder="이 경전 안에서 검색" autocomplete="off">
      </div>
      <div class="in-reader-search-info" id="in-reader-search-info">0 / 0</div>
      <div class="in-reader-search-nav">
        <button id="btn-search-prev" aria-label="이전">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14.71 6.71a.996.996 0 0 0-1.41 0L8.71 11.3a.996.996 0 0 0 0 1.41l4.59 4.59a.996.996 0 1 0 1.41-1.41L10.83 12l3.88-3.88c.39-.39.38-1.03 0-1.41z"/></svg>
        </button>
        <button id="btn-search-next" aria-label="다음">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.71c-.38-.38-1.02-.38-1.41 0z"/></svg>
        </button>
      </div>
      <button id="btn-in-search-close" class="in-reader-search-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <!-- 진행 막대 -->
    <div class="reading-progress">
      <div class="reading-progress-bar" id="reading-progress-bar"></div>
    </div>

    <div class="reader-content" id="reader-content"></div>
    <button id="btn-scroll-top" class="btn-scroll-top" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
    </button>
  </section>

  <!-- 읽기 설정 모달 -->
  <div id="settings-menu" class="modal-overlay">
    <div class="modal-inner">
      <div class="modal-title">읽기 설정</div>
      <div class="modal-body">
        <div class="setting-group">
          <div class="setting-label">글  꼴</div>
          <div class="setting-buttons cols-2">
            <button data-setting="font" data-value="gyeonggi">경기천년바탕</button>
            <button data-setting="font" data-value="nanum">나눔 명조</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">글자 크기</div>
          <div class="setting-buttons cols-4">
            <button data-setting="size" data-value="small">작게</button>
            <button data-setting="size" data-value="medium">보통</button>
            <button data-setting="size" data-value="large">크게</button>
            <button data-setting="size" data-value="xlarge">크게+</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">배 경 색</div>
          <div class="setting-buttons cols-3">
            <button data-setting="bg" data-value="beige" class="bg-preview"><span class="bg-dot beige"></span>베이지</button>
            <button data-setting="bg" data-value="sky" class="bg-preview"><span class="bg-dot sky"></span>하늘색</button>
            <button data-setting="bg" data-value="gray" class="bg-preview"><span class="bg-dot gray"></span>회색</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 책갈피 모달 -->
  <div id="bookmark-menu" class="modal-overlay">
    <div class="modal-inner">
      <div class="modal-title">책갈피</div>
      <div class="modal-body">
        <div id="bookmark-list-content"></div>
      </div>
    </div>
  </div>

  <!-- 목차 모달 -->
  <div id="toc-menu" class="modal-overlay">
    <div class="modal-inner">
      <div class="modal-title">목  차</div>
      <div class="modal-body">
        <div id="toc-list-content"></div>
      </div>
    </div>
  </div>

  <div id="bookmark-toast" class="bookmark-toast"></div>

  <script src="sutras-data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }
  </script>
</body>
</html>
